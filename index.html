<dialog id="dialogo-inicio">
    <h1>Super Meat Boy Remake</h1>
    <h3>Instruções</h3>
    <div id="conteiner-list">
        <ul>
            <p>Use as teclas 'a' e 'd' para correr</p>
            <p>Use a tecla 'space' para pular</p>
            <p>Se você correr e pular, o pulo vai mais longe</p>
            <p>Seu objetivo é percorrer a fase e chegar na outra personagem</p>
        </ul>
    </div>
    <p id="ppc">Divirta-se</p>
    <button id="btn-iniciar-jogo">Jogar!!</button>
</dialog>

<dialog id="dialogo-vitoria">
    <h1>Você Ganhou, Parabéns!</h1>
    <p id="tempo-final"></p>
    <button id="btn-ranking">Ver Ranking</button>
    <button id="btn-reiniciar">Jogar Novamente</button>
</dialog>

<dialog id="dialogo-ranking">
    <h2>Melhores Tempos</h2>
    <ol id="lista-ranking">
        
    </ol>
    <button id="btn-jogar-novamente">Jogar Novamente</button>
</dialog>
